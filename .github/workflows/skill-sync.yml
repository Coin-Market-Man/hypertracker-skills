name: Skill files in sync

on:
  pull_request:
  push:
    branches: [main, rc]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every platform file matches hypertracker-skill-master.md
        run: python3 scripts/sync-skill-files.py --check
